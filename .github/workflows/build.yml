name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Copy APK to docs for GitHub Pages
      run: cp app/build/outputs/apk/release/app-release.apk docs/ScreenTimeoutTile.apk

    - name: Rename APK for Release
      run: cp app/build/outputs/apk/release/app-release.apk ScreenTimeoutTile.apk

    - name: Commit APK to docs
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add docs/ScreenTimeoutTile.apk
        git commit -m "Update APK [auto]" || echo "No changes to commit"
        git push

    - name: Get App Version
      id: get_version
      run: |
        VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ steps.get_version.outputs.version_name }}
        name: Version ${{ steps.get_version.outputs.version_name }}
        body: Automatically generated APK from the latest code.
        artifacts: ScreenTimeoutTile.apk
        allowUpdates: true
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
