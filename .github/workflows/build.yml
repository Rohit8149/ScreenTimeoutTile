name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

# We need write permissions to create a GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      # Rename it so it looks clean when downloaded
      run: mv app/build/outputs/apk/debug/app-debug.apk ScreenTimeoutTile.apk

    - name: Create Release and Upload Raw APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Update Build ${{ github.run_number }}
        body: Automatically generated APK from the latest code.
        files: ScreenTimeoutTile.apk
