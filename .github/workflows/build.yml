name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Copy APK to docs for GitHub Pages
      run: cp app/build/outputs/apk/release/app-release.apk docs/ScreenTimeoutTile.apk

    - name: Rename APK for Release
      run: cp app/build/outputs/apk/release/app-release.apk ScreenTimeoutTile.apk

    - name: Commit APK to docs
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add docs/ScreenTimeoutTile.apk
        git commit -m "Update APK [auto]" || echo "No changes to commit"
        git push

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Update Build ${{ github.run_number }}
        body: Automatically generated APK from the latest code.
        files: ScreenTimeoutTile.apk
